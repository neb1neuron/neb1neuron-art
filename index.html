<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neb1neuron Art Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>neb1neuron</h1>
    </header>

    <main id="gallery-container">
        <div class="viewer">
            <button id="prev-btn" class="nav-btn">&lsaquo;</button>
            <div id="image-display">
                <img id="main-image" src="" alt="Loading painting...">
                <p id="image-caption"></p>
            </div>
            <button id="next-btn" class="nav-btn">&rsaquo;</button>
        </div>
        <div id="counter">0 / 0</div>
    </main>

    <footer>
        <p>&copy; 2023 neb1neuron</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
